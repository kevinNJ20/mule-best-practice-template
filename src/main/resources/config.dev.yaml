# Configuration pour l'environnement DEVELOPMENT

# Environment
env: "dev"

# HTTP Listener Configuration
http:
  host: "0.0.0.0"
  port: "8081"

# Database Configuration (exemple)
db:
  host: "dev-db.example.com"
  port: "5432"
  database: "dev_db"
  user: "dev_user"
  password: "dev_password"

# API Configuration
api:
  name: "Mule Best Practice API"
  version: "v1"
  basePath: "/api/v1"

# External Services (exemple)
services:
  external:
    baseUrl: "https://api.dev.example.com"
    timeout: "30000"
    maxRetries: "3"

# Security
security:
  client:
    id: "dev-client-id"
    secret: "dev-client-secret"

# Logging
logging:
  level: "DEBUG"
  correlationIdEnabled: "true"

# Business Configuration
business:
  maxTransactionAmount: "10000"
  batchSize: "10"

# MCP Server Configuration
mcp:
  server:
    port: "8084"
    host: "0.0.0.0"
    name: "Mule Best Practice MCP Server"