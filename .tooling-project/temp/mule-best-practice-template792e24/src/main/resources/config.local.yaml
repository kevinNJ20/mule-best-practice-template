# Configuration pour l'environnement LOCAL

# HTTP Listener Configuration
http:
  host: "localhost"
  port: "8082"

# Database Configuration (exemple)
db:
  host: "localhost"
  port: "5432"
  database: "local_db"
  user: "local_user"
  password: "local_password"

# API Configuration
api:
  name: "Mule Best Practice API"
  version: "v1"
  basePath: "/api/v1"

# External Services (exemple)
services:
  external:
    baseUrl: "http://localhost:9090"
    timeout: "10000"
    maxRetries: "2"

# Security
security:
  client:
    id: "local-client-id"
    secret: "local-client-secret"

# Logging
logging:
  level: "DEBUG"
  correlationIdEnabled: true

# Business Configuration
business:
  maxTransactionAmount: "1000"
  batchSize: "5"
