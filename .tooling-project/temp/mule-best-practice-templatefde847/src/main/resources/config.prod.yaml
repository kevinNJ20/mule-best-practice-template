# Configuration pour l'environnement PRODUCTION

# Environment
env: "prod"

# HTTP Listener Configuration
http:
  host: "0.0.0.0"
  port: "8081"

# Database Configuration (exemple)
db:
  host: "prod-db.example.com"
  port: "5432"
  database: "prod_db"
  user: "prod_user"
  # Le mot de passe doit être sécurisé via Secure Properties ou Runtime Manager

# API Configuration
api:
  name: "Mule Best Practice API"
  version: "v1"
  basePath: "/api/v1"

# External Services (exemple)
services:
  external:
    baseUrl: "https://api.production.example.com"
    timeout: "30000"
    maxRetries: "3"

# Security
security:
  client:
    id: "prod-client-id"
    # Le secret doit être sécurisé via Secure Properties

# Logging
logging:
  level: "INFO"
  correlationIdEnabled: "true"

# Business Configuration
business:
  maxTransactionAmount: "100000"
  batchSize: "100"

# MCP Server Configuration
mcp:
  server:
    port: "8085"
    host: "0.0.0.0"
    name: "Mule Best Practice MCP Server"

